<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Rozložení: hřiště přes celou plochu s jemnou mřížkou, nad ním plovoucí pilulky (název, nástroje, akce) a dole plovoucí střih kroků.
   Vizuálně navazuje na Trenér (stejná písma, karty, zaoblení), hlavní barva modrá, kontrastní žlutá. */
:root {
  --paper: #EEF2F7;
  --card: #FFFFFF;
  --ink: #1B2430;
  --ink-soft: #4A5564;
  --ink-faint: #6B7684;
  --line: #D6DDE6;
  --brand: #1F5FBF;
  --brand-dark: #174A96;
  --brand-soft: #E3ECF9;
  --accent: #FFC72C;
  --accent-ink: #3D2E00;
  --danger: #C24545;
  --stage: #DCE3EC;
  --grid: rgba(31,95,191,.07);
  --glass: rgba(255,255,255,.86);
  --radius: 12px;
  --radius-sm: 7px;
  --shadow: 0 1px 2px rgba(27,36,48,.07), 0 4px 14px rgba(27,36,48,.06);
  --font-display: 'Bebas Neue', Impact, sans-serif;
  --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0E1218; --card: #1A2029; --ink: #E9ECEF; --ink-soft: #A3ADBA; --ink-faint: #8D97A5;
  --line: #3A4554; --brand: #6EA0EE; --brand-dark: #8DB5F2; --brand-soft: #22324A; --accent: #FFD24D;
  --accent-ink: #2A2000; --danger: #E06666; --stage: #0D1219; --grid: rgba(255,255,255,.045); --glass: rgba(26,32,41,.88);
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0E1218; --card: #1A2029; --ink: #E9ECEF; --ink-soft: #A3ADBA; --ink-faint: #8D97A5;
  --line: #3A4554; --brand: #6EA0EE; --brand-dark: #8DB5F2; --brand-soft: #22324A; --accent: #FFD24D;
  --accent-ink: #2A2000; --danger: #E06666; --stage: #0D1219; --grid: rgba(255,255,255,.045); --glass: rgba(26,32,41,.88);
  --shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
svg.ik { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.ik.fa { fill: currentColor; stroke: none; width: 16px; height: 16px; }
.nt svg.ik.fa { width: 17px; height: 17px; }
.nt .sipecka.fa { width: 9px; height: 9px; }
.kvet-pamet svg.ik.fa { width: 13px; height: 13px; }

.app { position: relative; height: 100%; overflow: hidden; background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 48px 48px; background-position: center center; }

/* Plovoucí pilulky */
.pilulka { position: absolute; z-index: 15; display: flex; align-items: center; gap: 4px; padding: 5px; background: var(--glass);
  -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 999px; box-shadow: var(--shadow); }
.pilulka.vlevo { top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); padding-left: 10px; max-width: calc(50% - 140px); }
.pilulka.vpravo { top: 12px; right: max(12px, env(safe-area-inset-right, 0px)); }
.pilulka.nastroje { top: 12px; left: 50%; transform: translateX(-50%); }
.znak { display: flex; align-items: center; gap: 8px; flex: none; }
.znak svg { width: 26px; height: 26px; }
.znak b { font-family: var(--font-display); font-weight: 400; font-size: 21px; letter-spacing: .03em; line-height: 1; color: var(--brand-dark); white-space: nowrap; }
.nazev { flex: 1 1 120px; min-width: 60px; width: 210px; height: 32px; border: 1px solid transparent; border-radius: 999px;
  background: transparent; padding: 0 12px; font: inherit; font-weight: 700; color: var(--ink); text-overflow: ellipsis; }
.nazev:hover { background: var(--paper); }
.nazev:focus { outline: none; border-color: var(--brand); background: var(--card); }
.del { width: 1px; height: 22px; background: var(--line); margin: 0 3px; flex: none; }
.nt { position: relative; width: 40px; height: 36px; border: 0; border-radius: 999px; background: none; color: var(--ink-soft); cursor: pointer;
  display: grid; place-items: center; padding: 0; touch-action: none; }
.nt:hover { background: var(--paper); color: var(--ink); }
.nt[aria-pressed="true"], .nt[aria-expanded="true"] { background: var(--brand-soft); color: var(--brand-dark); }
.nt[aria-pressed="true"] { box-shadow: inset 0 0 0 1.5px var(--brand); }
.nt svg.ik { width: 20px; height: 20px; }
.nt .sipecka { position: absolute; right: 3px; bottom: 5px; width: 8px; height: 8px; stroke-width: 3; opacity: .55; }
.nt.dlazdice { aspect-ratio: auto; border: 0; padding: 0; }
.nt.dlazdice svg { width: 22px; height: 22px; }
.seg { display: flex; background: var(--paper); border-radius: 999px; padding: 3px; gap: 2px; flex: none; }
.seg button { border: 0; background: none; border-radius: 999px; height: 28px; padding: 0 12px; cursor: pointer; color: var(--ink-soft); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--brand-dark); font-weight: 700; box-shadow: var(--shadow); }
.tl { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; min-width: 34px; padding: 0 12px;
  border: 0; background: none; border-radius: 999px; cursor: pointer; white-space: nowrap; flex: none; color: var(--ink-soft); }
.tl:hover:not(:disabled) { background: var(--paper); color: var(--ink); }
.tl:disabled { opacity: .4; cursor: default; }
.tl.ikona { padding: 0; }
.tl.hlavni { background: var(--brand); color: #fff; font-weight: 700; }
:root[data-theme="dark"] .tl.hlavni { color: #0D1219; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tl.hlavni { color: #0D1219; } }
.tl[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-dark); }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }

/* Rozbalená skupina symbolů pod lištou nástrojů */
.vysuv { position: absolute; z-index: 25; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 8px; }
.mrizka { display: grid; grid-template-columns: repeat(4, 54px); gap: 6px; }
.dlazdice { aspect-ratio: 1; border: 1px solid transparent; border-radius: 10px; background: var(--paper); cursor: grab;
  display: flex; align-items: center; justify-content: center; padding: 4px; touch-action: none; user-select: none; -webkit-user-select: none; }
.dlazdice:hover { border-color: var(--brand); }
.vysuv .dlazdice[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.dlazdice svg { width: 100%; height: 100%; overflow: visible; pointer-events: none; }

/* Hřiště přes celou plochu mezi pilulkami */
.jeviste { position: absolute; inset: 0; }
/* Kolo 3: obal plochy – v plánu v něm leží hřiště, ve 3D se plán promítne perspektivou (matrix3d) a nad ním stojí postavy */
#plocha { position: absolute; left: 16px; top: 62px; width: calc(100% - 32px); height: calc(100% - 62px - 92px); touch-action: none; user-select: none; -webkit-user-select: none; }
#plocha.mira { cursor: crosshair; }
#deska { display: block; width: 100%; height: 100%; }
#plocha.d3 #deska { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0; }
#postavy { position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#postavy .prvek { pointer-events: auto; cursor: move; }
#postavy .cara { pointer-events: auto; cursor: pointer; }
.pilulka.kamera { top: 62px; right: max(12px, env(safe-area-inset-right, 0px)); padding: 4px 12px 4px 4px; gap: 6px; }
.pilulka.kamera input[type=range] { width: 120px; accent-color: var(--brand); }
.pilulka.kamera .uhel { font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; min-width: 28px; text-align: right; }
.ramecek { filter: drop-shadow(0 10px 28px rgba(10,20,40,.28)); }

/* Plovoucí lišta u vybraného prvku */
.plovak { position: absolute; z-index: 20; display: flex; align-items: center; gap: 2px; padding: 4px; background: var(--ink); color: var(--paper);
  border-radius: 999px; box-shadow: 0 6px 20px rgba(0,0,0,.25); white-space: nowrap; }
.plovak button { width: 32px; height: 32px; border: 0; border-radius: 999px; background: none; color: inherit; cursor: pointer; display: grid; place-items: center; }
.plovak button:hover { background: rgba(127,127,127,.25); }
.plovak button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.plovak .vzorek { width: 20px; height: 20px; border-radius: 50%; box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }
.plovak .cislo { display: flex; align-items: center; gap: 2px; padding: 0 4px 0 8px; height: 32px; border-radius: 999px; background: rgba(127,127,127,.18); }
.plovak .cislo input { width: 34px; height: 26px; border: 0; background: transparent; color: inherit; font: inherit; font-weight: 700; text-align: center; }
.plovak .cislo input:focus { outline: none; }
.plovak .del { background: rgba(127,127,127,.4); height: 20px; }
.plovak .vyska { display: flex; align-items: center; gap: 6px; padding: 0 8px; }
.plovak .vyska input { width: 120px; accent-color: var(--accent); }
.plovak .vyska b { min-width: 44px; font-size: 13px; font-variant-numeric: tabular-nums; }
.plovak .pocet { min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px; background: var(--brand); color: #fff; font-weight: 700; display: grid; place-items: center; font-size: 13px; }
.plovak button[data-stav] { position: relative; }
.plovak button[data-stav="auto"]::after { content: "A"; position: absolute; right: 3px; bottom: 1px; font-size: 9px; font-weight: 700; line-height: 1; }
.plovak button[data-stav="ne"] svg { opacity: .45; }
.plovak button[data-stav="ne"]::after { content: ""; position: absolute; left: 50%; top: 50%; width: 22px; height: 2px; margin: -1px 0 0 -11px; background: currentColor; border-radius: 1px; transform: rotate(-45deg); }
/* Kolo kpost: panel Postavení */
#zasobnik.postaveni { width: 336px; max-width: calc(100vw - 16px); display: flex; flex-direction: column; gap: 8px; }
.post-sit { display: flex; flex-wrap: wrap; gap: 4px; }
.post-sit button { height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); color: var(--ink-soft); cursor: pointer; font-size: 13px; }
.post-sit button[aria-pressed="true"] { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark); font-weight: 700; }
.post-strana, .post-zdroj { align-self: flex-start; }
.post-volby { display: flex; flex-wrap: wrap; gap: 8px; } /* Kolo kprevzit: strana a Nové | Převzít v jednom řádku */
.post-rot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.post-rot .rot { border: 1px solid transparent; border-radius: 7px; background: var(--paper); cursor: pointer; padding: 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--ink-soft); }
.post-rot .rot:hover { border-color: var(--brand); }
.post-rot .rot svg { width: 100%; height: auto; display: block; }
.post-rot .rot b { font-size: 11.5px; font-weight: 600; }
/* Kolo kpwa: bublina na iPadu – kde je Přidat na plochu */
.ios-plocha { top: 114px; right: max(12px, env(safe-area-inset-right, 0px)); width: auto; max-width: calc(100% - 24px); flex-direction: row; align-items: center; gap: 8px; padding: 6px 6px 6px 14px; color: var(--ink); }
.ios-plocha > span { display: grid; place-items: center; color: var(--brand); }
.ios-plocha b { font-weight: 600; white-space: nowrap; }
body.prehravac .ios-plocha { display: none !important; }
/* Kolo kembed: v přehrávači malý panel kamery (Ruka zůstává) */
body.prehravac .pilulka.kamera { left: auto !important; right: max(8px, env(safe-area-inset-right, 0px)) !important; width: 232px !important; flex-direction: column; align-items: stretch;
  gap: 0 !important; padding: 2px 28px 2px 2px !important; }
body.prehravac .pilulka.kamera > .del, body.prehravac .pilulka.kamera .uhel, body.prehravac .pilulka.kamera .kam-tah { display: none !important; }
body.prehravac .pilulka.kamera .kam-radek { width: 100%; gap: 2px; }
body.prehravac .pilulka.kamera .tl { height: 28px !important; min-width: 28px !important; }

body.prehravac .pilulka.kamera input[type=range] { height: 22px !important; flex: 1; width: auto; min-width: 0; }

body.prehravac .pilulka.kamera .otoceni input { width: 100%; }
body.prehravac .pilulka.kamera .kam-zavrit { position: absolute; right: 0; top: 0; }
/* Kolo kexport: okno Uložit */
.uloz-okno { width: 280px; gap: 2px; padding: 8px; }
.uloz-nazev { height: 34px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--ink); font: inherit; font-weight: 700; padding: 0 10px; margin-bottom: 6px; }
.uloz-nazev:focus { outline: none; border-color: var(--brand); }
.uloz-radek { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 4px 10px; border: 0; border-radius: 7px; background: none; cursor: pointer; text-align: left; color: var(--ink); }
.uloz-radek:hover { background: var(--paper); }
.uloz-radek svg { color: var(--brand); }
.uloz-radek span { display: flex; flex-direction: column; font-weight: 600; }
.uloz-radek small { font-weight: 400; font-size: 12px; color: var(--ink-faint); font-variant-numeric: tabular-nums; }
.uloz-radek.nedavne { min-height: 34px; padding-left: 38px; } /* Kolo knedavna */
/* Kolo knapoveda: okno nápovědy přes celou plochu (jako v Trenérovi) */
.napoveda { position: fixed; inset: 0; z-index: 900; background: var(--paper); color: var(--ink); overflow-y: auto; -webkit-overflow-scrolling: touch; }
.napoveda .nap-in { max-width: 720px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) 16px 40px; }
.napoveda .nap-hlava { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--paper); padding: 6px 0 10px; z-index: 1; flex-wrap: wrap; }
.napoveda h2 { margin: 0; flex: 1; font-family: 'Bebas Neue', Impact, sans-serif; font-weight: 400; font-size: 30px; letter-spacing: .5px; }
.napoveda .nap-zavrit { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--ink); display: grid; place-items: center; cursor: pointer; }
.napoveda .nap-zavrit:hover { background: var(--card); }
.napoveda .nap-hledat { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; flex-basis: 100%; }
.napoveda .nap-hledat svg { width: 15px; height: 15px; color: var(--ink-faint); flex: none; }
.napoveda .nap-hledat input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 11px 0; outline: none; }
.napoveda .nap-skupina { font-size: 12px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-faint); margin: 20px 0 8px; }
.napoveda .nap-blok { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--card); overflow: hidden; }
.napoveda .nap-blok > summary { list-style: none; cursor: pointer; padding: 12px 14px; font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 10px; }
.napoveda summary::-webkit-details-marker { display: none; }
.napoveda .nap-blok > summary svg { width: 18px; height: 18px; color: var(--brand); flex: none; }
.napoveda .nap-telo { padding: 0 14px 8px; }
.napoveda .nap-ot { border-top: 1px solid var(--line); }
.napoveda .nap-ot > summary { list-style: none; cursor: pointer; padding: 10px 2px; font-size: 14px; color: var(--ink-soft); }
.napoveda .nap-ot[open] > summary { color: var(--ink); font-weight: 600; }
.napoveda .nap-odp { font-size: 14px; line-height: 1.55; color: var(--ink-soft); padding: 0 2px 12px; }
.napoveda .nap-obr { display: block; margin-top: 10px; width: 132px; height: auto; max-width: 100%; border-radius: 8px; border: 1px solid var(--line); cursor: zoom-in; background: var(--stage); transition: width .2s; }
.napoveda .nap-obr.velky { width: 100%; cursor: zoom-out; }
.napoveda .nap-vysledek { border-bottom: 1px solid var(--line); padding: 12px 2px; }
.napoveda .nap-vysledek small { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--brand); margin-bottom: 3px; }
.napoveda .nap-vysledek b { display: block; font-size: 15px; margin-bottom: 4px; }
.napoveda .nap-prazdno { text-align: center; color: var(--ink-faint); padding: 30px 0; }
.uloz-radek.pod { min-height: 34px; padding-left: 28px; } /* Kolo kmenu: položky rozbalené skupiny (kmenu2: s ikonou) */
.uloz-radek.pod > svg:not(.sipecka) { width: 15px; height: 15px; }
.uloz-radek.pod.nedavne { padding-left: 53px; }
.uloz-radek .sipecka { margin-left: auto; width: 12px; height: 12px; color: var(--ink-faint); transform: rotate(-90deg); transition: transform .15s; }
.uloz-radek[aria-expanded="true"] .sipecka { transform: none; }
.uloz-radek[aria-expanded="true"] { background: var(--paper); }
.uloz-radek.nahrava svg { color: var(--danger); animation: magnetPulz 1s ease-in-out infinite; }
.del-h { height: 1px; background: var(--line); margin: 4px 6px; }
.uloz-vyb { display: flex; gap: 10px; padding: 6px 10px; color: var(--ink-faint); align-items: flex-start; }
.uloz-vyb span { display: flex; flex-wrap: wrap; gap: 4px; }
.uloz-vyb i { font-style: normal; font-size: 12.5px; padding: 2px 8px; border-radius: 999px; background: var(--paper); color: var(--ink-soft); }
/* Kolo kvideo (60A): přehrávač jako video – hřiště přes celý rámeček, velké Přehrát, dole průběh s čárkami kroků; při přehrávání se ovládání schová */
body.prehravac .pilulka.vlevo, body.prehravac .pilulka.nastroje, body.prehravac #zasobnik, body.prehravac .strih,
body.prehravac .pilulka.vpravo.prazdna,
body.prehravac .pilulka.vpravo > :not(#zpetDoEditoru) { display: none !important; }
body.prehravac .pilulka.vpravo { top: 8px; right: 8px; left: auto; height: auto; padding: 4px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); z-index: 17; }
body.prehravac .pilulka.vpravo .tl { color: var(--ink-soft); background: none; }
body.prehravac #plocha { top: 0; left: 0; width: 100%; height: 100%; contain: strict; }
body.telefon #plocha { contain: strict; } /* Kolo kmobil3d: i v editoru na telefonu */ /* Kolo kblikani: překreslování jen uvnitř plochy */
/* Kolo kobrana (68A): ovládání kamery i v přehrávači – vpravo nahoře, se schovaným ovládáním zmizí */
body.prehravac .pilulka.kamera, body.prehravac .kamera-mini { top: 8px; z-index: 17; transition: opacity .3s; }
.vid.skryto ~ .pilulka.kamera, .vid.skryto ~ .kamera-mini { opacity: 0; pointer-events: none; }
body.prehravac { user-select: none; -webkit-user-select: none; }
body.prehravac .prvek, body.prehravac .cara { pointer-events: none !important; cursor: default !important; }
.vid { position: absolute; inset: 0; z-index: 16; pointer-events: none; }
.vid > * { pointer-events: auto; }
.vid-velke { position: absolute; left: 50%; top: 50%; width: 76px; height: 76px; margin: -38px 0 0 -38px; border: 0; border-radius: 50%; background: rgba(15,20,28,.62); color: #fff;
  display: grid; place-items: center; cursor: pointer; box-shadow: 0 6px 24px rgba(0,0,0,.3); transition: transform .15s; }

.vid-lista { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 4px; padding: 22px 8px calc(6px + env(safe-area-inset-bottom, 0px));
  color: #fff; background: linear-gradient(rgba(10,14,20,0), rgba(10,14,20,.66)); transition: opacity .3s; }
.vid.skryto .vid-lista { opacity: 0; pointer-events: none; }
.vid-tl { flex: none; height: 36px; min-width: 36px; padding: 0 8px; border: 0; border-radius: 7px; background: none; color: inherit; cursor: pointer;
  display: grid; place-items: center; font: inherit; font-weight: 700; font-size: 13px; }
.vid-tl:hover { background: rgba(255,255,255,.16); }
.vid-tl[aria-pressed="true"] { background: rgba(255,255,255,.26); }
.vid-osa { flex: 1; min-width: 60px; height: 32px; padding: 0 6px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
.vid-stopa { position: relative; flex: 1; height: 4px; border-radius: 2px; background: rgba(255,255,255,.35); }
.vid-stopa b { position: absolute; top: -2px; width: 2px; height: 8px; margin-left: -1px; border-radius: 1px; background: rgba(255,255,255,.85); }

#vidVypln::after { content: ""; position: absolute; right: -6px; top: 50%; width: 12px; height: 12px; margin-top: -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); }

/* Kolo kprehravac (96A): úzký rámeček – lišta se vejde (Přehrát, průběh, Opakovat, 3D a Celá obrazovka vždy) */
@media (max-width: 480px) {

}

@media (max-height: 260px) { .vid-velke { width: 52px; height: 52px; margin: -26px 0 0 -26px; } .vid-velke svg.ik.fa { width: 22px; height: 22px; } }
.uloz-odkaz { height: 30px; font-weight: 400; font-size: 12px; font-family: ui-monospace, monospace; }
.oblast { position: absolute; z-index: 18; border: 1.5px solid var(--brand); background: rgba(31,95,191,.12); border-radius: 4px; pointer-events: none; }

/* Zóny */
.vyskakovaci { position: absolute; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 12px; width: 300px; display: flex; flex-direction: column; gap: 10px; }
.radek { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.prepinac { width: 40px; height: 22px; border-radius: 999px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; }
.prepinac::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.prepinac[aria-checked="true"] { background: var(--brand); }
.prepinac[aria-checked="true"]::after { transform: translateX(18px); }
#miniZony { width: 100%; height: auto; display: block; }
#miniZony .z { cursor: pointer; }
.drobne { display: flex; gap: 6px; }
.drobne .tl { height: 30px; font-size: 13px; flex: 1; background: var(--paper); }

/* Střih kroků – plovoucí dole */
.strih { position: absolute; z-index: 15; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  width: max-content; max-width: calc(100% - 24px); display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px;
  background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 22px; box-shadow: var(--shadow); }
.prehrat { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--brand); color: #fff; display: grid; place-items: center; flex: none; cursor: pointer; }
.prehrat:disabled { opacity: .45; cursor: default; }
.prehrat svg { fill: currentColor; stroke: none; }
.osa { flex: 1; min-width: 0; overflow-x: auto; display: flex; flex-direction: column; gap: 3px; }
.pravitko { position: relative; height: 14px; font-size: 10.5px; color: var(--ink-faint); font-variant-numeric: tabular-nums; flex: none; }
.pravitko span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; }
.kroky { display: flex; gap: 4px; align-items: stretch; height: 38px; flex: none; }
.krok { position: relative; flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 0 18px 0 10px;
  display: flex; align-items: center; gap: 6px; cursor: pointer; overflow: hidden; min-width: 0; }
.krok b { font-weight: 700; white-space: nowrap; }
.krok small { color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.krok[aria-current="true"] { border-color: var(--brand); background: var(--brand-soft); box-shadow: inset 0 0 0 1px var(--brand); }
.krok .uchyt { position: absolute; right: 0; top: 0; bottom: 0; width: 10px; cursor: ew-resize; touch-action: pan-x; display: grid; place-items: center; }
.krok .uchyt::after { content: ""; width: 3px; height: 16px; border-radius: 2px; background: var(--ink-faint); opacity: .6; }
.krok .zrus { width: 20px; height: 20px; border: 0; border-radius: 50%; background: none; color: var(--ink-faint); cursor: pointer; display: grid; place-items: center; padding: 0; flex: none; }
.krok .zrus:hover { background: rgba(194,69,69,.15); color: var(--danger); }
.krok .zrus svg { width: 13px; height: 13px; }
.pridat { flex: none; width: 38px; border: 1px dashed var(--ink-faint); border-radius: 10px; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink-soft); }
.pridat:hover { border-color: var(--brand); color: var(--brand-dark); }

/* Hláška s Vrátit */
.hlaska { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--paper);
  border-radius: 999px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: calc(100% - 32px); }
.hlaska button { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 700; border-radius: 999px; height: 30px; padding: 0 14px; cursor: pointer; }

/* Ghost při tažení ze zásobníku */
.duch { position: fixed; z-index: 70; width: 46px; height: 46px; pointer-events: none; transform: translate(-50%,-50%); opacity: .85; }
.duch svg { width: 100%; height: 100%; overflow: visible; }

/* Květ barev */
.kvet-host { position: fixed; z-index: 80; display: flex; align-items: center; justify-content: center; }
.kvet-host .bcp-root { filter: drop-shadow(0 10px 24px rgba(0,20,60,.25)); }
.kvet-prouzek { position: fixed; z-index: 81; width: 250px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px;
  box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; }
.kvet-rezimy { display: flex; gap: 2px; background: var(--paper); border-radius: 999px; padding: 3px; }
.kvet-rezimy button { flex: 1; height: 26px; border: 0; background: none; border-radius: 999px; cursor: pointer; font-size: 12px; color: var(--ink-soft); }
.kvet-rezimy button.zvoleny { background: var(--card); color: var(--brand-dark); font-weight: 700; box-shadow: var(--shadow); }
.kvet-info { display: flex; align-items: center; gap: 6px; }
.kvet-nahled { width: 24px; height: 24px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
.kvet-pamet { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
.kvet-pamet svg { width: 14px; height: 14px; color: var(--ink-faint); flex: none; margin-right: 2px; }
.kvet-pamet button { width: 22px; height: 22px; border-radius: 50%; border: 0; padding: 0; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.kvet-pamet button:hover { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18), 0 0 0 2px var(--brand); }
.kvet-hex { width: 92px; height: 28px; padding: 0 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--card); color: var(--ink); font-family: ui-monospace, monospace; font-size: 12.5px; }

/* Užší obrazovky: nástroje pod horní řadou, na telefonu bez názvu a popisků */
@media (max-width: 1180px) {
  .pilulka.nastroje { top: 62px; }
  #plocha { top: 112px; height: calc(100% - 112px - 92px); }
  .pilulka.vlevo { max-width: calc(100% - 470px); }
}
@media (max-width: 760px) {
  .znak b, .nazev, #zonyTl span, #ulozitTl span { display: none; }
  .pilulka.vlevo { display: none; }
  .seg button { font-size: 13px; }
  .pilulka.vpravo { left: 8px; right: max(8px, env(safe-area-inset-right, 0px)); justify-content: flex-end; flex-wrap: nowrap; overflow-x: auto; }
  .seg button { padding: 0 8px; }
  #plocha { left: 8px; width: calc(100% - 16px); }
  .pilulka.kamera { top: auto; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); right: 8px; }
  .pilulka.kamera input[type=range] { width: 90px; }
  .mrizka { grid-template-columns: repeat(4, 48px); }
}
/* Kolo 3: magnet – kam se prvek právě přichytí (pulzuje), a záblesk po přichycení */
.magnet { transform-box: fill-box; transform-origin: center; animation: magnetPulz .8s ease-in-out infinite; }
@keyframes magnetPulz { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.22); opacity: .65; } }
.zablesk { transform-box: fill-box; transform-origin: center; animation: zablesk .6s ease-out forwards; }
@keyframes zablesk { from { transform: scale(.7); opacity: 1; } to { transform: scale(2); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================================================================
   Varianta „Trenér“: barvy a skladba podle aplikace Trenér
   (zelená hlavička s bílým nadpisem, bílá lišta jako záložky Knihovna/Tréninky
   s oranžovým podtržením, papírové pozadí, karty s linkou, tlačítka 7 px).
   ================================================================ */
:root {
  --paper: #F4F5F2; --card: #FFFFFF; --ink: #1B2430; --ink-soft: #4A5564; --ink-faint: #6B7684; --line: #DCDFD9;
  --brand: #339933; --brand-dark: #216321; --brand-soft: #E7F3E7; --accent: #E8622C; --accent-ink: #FFFFFF;
  --stage: #F4F5F2; --grid: transparent; --glass: #FFFFFF;
  --shadow: 0 1px 2px rgba(27,36,48,.07), 0 4px 14px rgba(27,36,48,.05);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #151A21; --card: #1F2630; --ink: #E9ECEF; --ink-soft: #9BA4B0; --ink-faint: #929BA8; --line: #454F5C;
  --brand: #339933; --brand-dark: #5CAD79; --brand-soft: #24352A; --accent: #E8622C; --accent-ink: #FFFFFF;
  --stage: #151A21; --grid: transparent; --glass: #1F2630; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #151A21; --card: #1F2630; --ink: #E9ECEF; --ink-soft: #9BA4B0; --ink-faint: #929BA8; --line: #454F5C;
  --brand: #339933; --brand-dark: #5CAD79; --brand-soft: #24352A; --accent: #E8622C; --accent-ink: #FFFFFF;
  --stage: #151A21; --grid: transparent; --glass: #1F2630; --shadow: 0 1px 2px rgba(0,0,0,.45), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark; }
.app { background-image: none; }
.pilulka { -webkit-backdrop-filter: none; backdrop-filter: none; }

/* zelená hlavička */
.pilulka.vlevo { top: 0; left: 0; right: 0; max-width: none; height: 56px; padding: 0 18px; border: 0; border-radius: 0;
  background: var(--brand); box-shadow: none; z-index: 14; }
.pilulka.vlevo .znak b { color: #fff; font-size: 24px; }
.pilulka.vlevo .znak svg rect:first-child { fill: rgba(255,255,255,.18); }
.pilulka.vlevo .nazev { color: #fff; width: 200px; flex: none; border-radius: 7px; }
.pilulka.vlevo .nazev:hover { background: rgba(255,255,255,.12); }
.pilulka.vlevo .nazev:focus { background: var(--card); color: var(--ink); border-color: transparent; }
.pilulka.vpravo { top: 0; right: 0; height: 56px; padding: 0 14px; border: 0; border-radius: 0; background: transparent; box-shadow: none; z-index: 15; gap: 6px; }
.pilulka.vpravo .seg { background: rgba(255,255,255,.14); border-radius: 7px; }
.pilulka.vpravo .seg button { color: rgba(255,255,255,.85); border-radius: 5px; }
.pilulka.vpravo .seg button[aria-pressed="true"] { background: #fff; color: #216321; box-shadow: none; }
.pilulka.vpravo .tl { color: #fff; background: rgba(255,255,255,.12); border-radius: 7px; }
.pilulka.vpravo .tl:hover:not(:disabled) { background: rgba(255,255,255,.22); color: #fff; }
.pilulka.vpravo .tl[aria-pressed="true"] { background: #fff; color: #216321; }
.pilulka.vpravo .tl.hlavni { background: var(--accent); color: #fff; }
.pilulka.vpravo .del { background: rgba(255,255,255,.3); }

/* bílá lišta nástrojů jako záložky v Trenérovi */
.pilulka.nastroje { top: 56px; left: 0; right: 0; transform: none; height: 50px; padding: 0 12px; gap: 0; justify-content: center;
  border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: var(--card); box-shadow: none; }
.pilulka.nastroje .del { display: none; }
.nt { width: auto; height: 50px; padding: 0 16px; border-radius: 0; border-bottom: 3px solid transparent; color: var(--ink-faint);
  display: inline-flex; align-items: center; gap: 7px; font-weight: 600; font-size: 14px; }
.nt::after { content: attr(aria-label); }
.nt:hover { background: transparent; color: var(--ink); }
.nt[aria-pressed="true"], .nt[aria-expanded="true"] { background: transparent; color: var(--brand); border-bottom-color: var(--accent); box-shadow: none; }
:root[data-theme="dark"] .nt[aria-pressed="true"], :root[data-theme="dark"] .nt[aria-expanded="true"] { color: var(--brand-dark); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .nt[aria-pressed="true"], :root:not([data-theme="light"]) .nt[aria-expanded="true"] { color: var(--brand-dark); } }
.nt .sipecka { position: static; width: 10px; height: 10px; order: 2; }
.pilulka.nastroje .nt.dlazdice { aspect-ratio: auto; width: auto; padding: 0 16px; background: transparent; border: 0; border-bottom: 3px solid transparent; border-radius: 0; }
.pilulka.nastroje .nt.dlazdice[aria-pressed="true"] { border-bottom-color: var(--accent); }
.pilulka.nastroje .nt.dlazdice svg { width: 20px; height: 20px; }
.vysuv { border-radius: 12px; }
.dlazdice { border-radius: 7px; }

/* hřiště pod lištami, střih jako spodní lišta */
#plocha { top: 118px; height: calc(100% - 118px - 74px); }
.strih { left: 0; right: 0; bottom: 0; transform: none; width: auto; max-width: none; border: 0; border-top: 1px solid var(--line); border-radius: 0;
  background: var(--card); box-shadow: none; padding: 8px 16px calc(8px + env(safe-area-inset-bottom, 0px)); }
.krok, .pridat { border-radius: 7px; }
.pilulka.kamera { top: 118px; background: var(--card); border-radius: 12px; }

/* lišta u vybraného prvku jako karta */
.plovak { background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.plovak button:hover { background: rgba(127,127,127,.12); }
.plovak button[aria-pressed="true"] { background: var(--brand); color: #fff; }
.plovak .vzorek { box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
.plovak .cislo { background: var(--paper); }
.plovak .vyska input { accent-color: var(--brand); }
.hlaska button { color: #fff; }
.vyskakovaci { border-radius: 12px; }

@media (max-width: 1180px) {
  .pilulka.nastroje { top: 56px; }
  #plocha { top: 118px; height: calc(100% - 118px - 74px); }
  .pilulka.vlevo .nazev { width: 140px; }
}
@media (max-width: 900px) { .pilulka.vlevo .nazev { display: none; } }
@media (max-width: 760px) {
  .pilulka.vlevo { display: flex; padding: 0 10px; }
  .pilulka.vpravo { left: 50px; right: 0; padding: 0 8px; justify-content: flex-start; }
  .nt::after { display: none; }
  .nt { padding: 0 12px; }
  #plocha { left: 8px; width: calc(100% - 16px); }
  .pilulka.kamera { top: auto; bottom: calc(74px + env(safe-area-inset-bottom, 0px)); }
  body.prehravac .pilulka.kamera, body.prehravac .kamera-mini { top: auto; } /* Kolo kobrana: na telefonu nad lištou přehrávače */
}

/* Kolo iPad: pilulka kamery po řádcích, značky otočení po 90°, ruka, větší plochy pro prst */
.kam-radek { display: flex; align-items: center; gap: 4px; }
.otoceni { --palec: 8px; position: relative; display: flex; align-items: center; }
#sklonPlus svg { transform: scaleY(-1); } /* Kolo kkamera: šipka nahoru = převrácená šipka dolů */
/* Kolo kkamera (213C): natočení – zelená od 0° uprostřed k jezdci */
#otoceni { -webkit-appearance: none; appearance: none; background: transparent; --a: .5; --b: .5; }
#otoceni::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line);
  background: linear-gradient(to right, var(--paper) calc(var(--palec) + (100% - 2 * var(--palec)) * var(--a)), var(--brand) 0, var(--brand) calc(var(--palec) + (100% - 2 * var(--palec)) * var(--b)), var(--paper) 0); }
#otoceni::-moz-range-track { height: 8px; border-radius: 4px; box-shadow: inset 0 0 0 1px var(--line);
  background: linear-gradient(to right, var(--paper) calc(var(--palec) + (100% - 2 * var(--palec)) * var(--a)), var(--brand) 0, var(--brand) calc(var(--palec) + (100% - 2 * var(--palec)) * var(--b)), var(--paper) 0); }
#otoceni::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: calc(2 * var(--palec)); height: calc(2 * var(--palec)); margin-top: calc(4px - var(--palec)); border: 0; border-radius: 50%; background: var(--brand); cursor: pointer; }

// ------------------------------------------------------------ geometrie (v metrech)
const HRISTE = {

};
const BARVA = { zamezi: '#3D6FA3', dvorec: '#E39B57', cara: '#FFFFFF', sit: '#1B2430' };
const CARA = 0.08;
// Kolo iPad: ruka (posun obrazu ve 3D), výběr více klepáním, dotykové ovládání (větší úchyty)
let ruka = false, viceRezim = false;
const DOTEK = matchMedia('(pointer: coarse)').matches;
const TELEFON = DOTEK && Math.min(screen.width, screen.height) < 600; // Kolo kmobil3d: telefon (ne tablet)
document.body.classList.toggle('telefon', TELEFON);

// Zóny z pohledu týmu, který kouká na síť (pravá ruka = zóna 1, 2).
function zony(kurt) {
  const z = [];
  const pridej = (klic, n, x, y, w, h) => z.push({ klic, n, x, y, w, h });
  if (kurt === 'cele') {
    // levý tým kouká doprava: levá ruka nahoře
    const L = { 4: [6, 0], 3: [6, 3], 2: [6, 6], 5: [0, 0], 6: [0, 3], 1: [0, 6] };
    for (const [n, [x, y]] of Object.entries(L)) pridej('L' + n, +n, x, y, x === 6 ? 3 : 6, 3);
    const P = { 2: [9, 0], 3: [9, 3], 4: [9, 6], 1: [12, 0], 6: [12, 3], 5: [12, 6] };
    for (const [n, [x, y]] of Object.entries(P)) pridej('P' + n, +n, x, y, x === 9 ? 3 : 6, 3);
  } else {
    const H = { 4: [0, 0], 3: [3, 0], 2: [6, 0], 5: [0, 3], 6: [3, 3], 1: [6, 3] };
    for (const [n, [x, y]] of Object.entries(H)) pridej('H' + n, +n, x, y, 3, y === 0 ? 3 : 6);
  }
  return z;
}

// ------------------------------------------------------------ symboly
const FA_MIC = 'M511.8 267.4c-26.1 8.7-53.4 13.8-81 15.1c9.2-105.3-31.5-204.2-103.2-272.4C434.1 41.1 512 139.5 512 256c0 3.8-.1 7.6-.2 11.4zm-3.9 34.7c-5.8 32-17.6 62-34.2 88.7c-97.5 48.5-217.7 42.6-311.9-24.5c23.7-36.2 55.4-67.7 94.5-91.8c79.9 43.2 170.1 50.8 251.6 27.6zm-236-55.5c-2.5-90.9-41.1-172.7-101.9-231.7C196.8 5.2 225.8 0 256 0c2.7 0 5.3 0 7.9 .1c90.8 60.2 145.7 167.2 134.7 282.3c-43.1-2.4-86.4-14.1-126.8-35.9zM138 28.8c20.6 18.3 38.7 39.4 53.7 62.6C95.9 136.1 30.6 220.8 7.3 316.9C2.5 297.4 0 277 0 256C0 157.2 56 71.5 138 28.8zm69.6 90.5c19.5 38.6 31 81.9 32.3 127.7C162.5 294.6 110.9 368.9 90.2 451C66 430.4 45.6 405.4 30.4 377.2c6.7-108.7 71.9-209.9 177.1-257.9zM256 512c-50.7 0-98-14.7-137.8-40.2c5.6-27 14.8-53.1 27.4-77.7C232.2 454.6 338.1 468.8 433 441c-46 44-108.3 71-177 71z';
// Kolo 3: jiné míče – skutečný poměr velikostí, zvětšený tak, aby byl vidět i tenisák
const MIC2 = {
  tenisak: { nazev: 'Tenisák', r: .12, barva: '#C8E03A', tr: 'Tenisák' },
  minimic: { nazev: 'Minimíč', r: .11, barva: '#FFD43B', tr: 'Minimíč' },
  overball: { nazev: 'Overball', r: .15, barva: '#E0559A', tr: 'Overball' },
  balonek: { nazev: 'Nafukovací balonek', r: .15, barva: '#E53935', tr: 'Nafukovací balonek' },
  medik: { nazev: 'Medicinbal', r: .19, barva: '#6B4A33', tr: 'Medik' },
  gymball: { nazev: 'Gymball', r: .33, barva: '#1EA7D8', tr: 'Gymball' },
};
const kresliMic2 = (o) => { const m = MIC2[o.druh] || MIC2.tenisak, r = m.r;
  const vzor = o.druh === 'tenisak' ? `<path d="M${-r * .7} ${-r * .7} Q0 0 ${-r * .7} ${r * .7} M${r * .7} ${-r * .7} Q0 0 ${r * .7} ${r * .7}" fill="none" stroke="#fff" stroke-width="${r * .14}"/>`
    : o.druh === 'medik' ? `<path d="M${-r} 0H${r}" stroke="#C9A27E" stroke-width="${r * .3}"/>`
    : o.druh === 'balonek' ? `<path d="M${r * .9} 0 l${r * .35} ${-r * .2} v${r * .4}z" fill="${m.barva}"/>`
    : o.druh === 'minimic' ? `<path transform="scale(${r * 2 / 512}) translate(-256 -256)" d="${FA_MIC}" fill="#1F4FA8" fill-opacity=".55"/>` : '';
  return `<circle r="${r}" fill="${m.barva}" stroke="#fff" stroke-width="${Math.max(.02, r * .12)}"/>${vzor}`; };
const R = 0.42;
const svetly = (b) => (kontrast(b, '#ffffff') || 0) < 2.6;
const popisBarva = (b) => svetly(b) ? '#1B2430' : '#FFFFFF';
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const text = (t, barva, vel = 0.5, y = 0) => t ? `<text x="0" y="${y}" fill="${barva}" font-family="DM Sans, sans-serif" font-weight="700" font-size="${vel}" text-anchor="middle" dominant-baseline="central">${esc(t)}</text>` : '';
// Rozběh podle předlohy: n půlkruhů za sebou, na koncích krátké vodorovné nožky
const vlny = (n) => {
  const r = n === 3 ? .2 : .3, nozka = .14, sirka = n * 2 * r, y = r / 2;
  let d = `M${-sirka / 2 - nozka} ${y}h${nozka}`;
  for (let i = 0; i < n; i++) d += `a${r} ${r} 0 0 1 ${2 * r} 0`;
  return d + `h${nozka}`;
};

// typ: název, skupina, výchozí barva, otáčení, číslo, zorné pole, kreslení (lokálně, směr = +x)
// Kolo ktyp: přepínání typu hráče dokola, tvar ikony = kolečko / trojúhelník / čtverec
const TYP_HRACE = {
  kruh: { dalsi: 'utok', tvar: '<circle cx="256" cy="256" r="200"/>' },
  utok: { dalsi: 'blok', tvar: '<path d="M470 256 L90 46 L90 466 Z"/>' },
  blok: { dalsi: 'kruh', tvar: '<rect x="66" y="66" width="380" height="380" rx="40"/>' },
};
const TYPY = {
  kruh:   { nazev: 'Hráč', stoji: 'postava', sk: 'hraci', barva: '#c62828', toc: true, cislo: true, kuzel: true,
            kresli: (o) => `<circle r="${R}" fill="${o.barva}" stroke="#fff" stroke-width=".06"/>` },
  blok:   { nazev: 'Blok', stoji: 'blok', sk: 'hraci', barva: '#1f4fa8', toc: true, cislo: true, kuzel: true,
            kresli: (o) => `<rect x="-.4" y="-.4" width=".8" height=".8" rx=".07" fill="${o.barva}" stroke="#fff" stroke-width=".06"/>` },
  // Dvojblok a trojblok: čtverečky vedle sebe napříč směrem bloku (směr = +x)
  blok2:  { nazev: 'Dvojblok', stoji: 'blok2', sk: 'hraci', barva: '#1f4fa8', toc: true, nahled: 2.0,
            kresli: (o) => [-.45, .45].map((y) => `<rect x="-.4" y="${y - .4}" width=".8" height=".8" rx=".07" fill="${o.barva}" stroke="#fff" stroke-width=".06"/>`).join('') },
  blok3:  { nazev: 'Trojblok', stoji: 'blok3', sk: 'hraci', barva: '#1f4fa8', toc: true, nahled: 2.9,
            kresli: (o) => [-.9, 0, .9].map((y) => `<rect x="-.4" y="${y - .4}" width=".8" height=".8" rx=".07" fill="${o.barva}" stroke="#fff" stroke-width=".06"/>`).join('') },
  // Kolo 2: hráčka jako dvě kuličky – rozestup se táhne za kuličku (těsně = blok, dál = nohy)
  nohy:   { nazev: 'Dvě kuličky', stoji: 'nohy', sk: 'hraci', barva: '#c62828', toc: true, kuzel: true, nahled: 1.3,
            kresli: (o) => { const r = (o.roz ?? .36) / 2; return `<circle cy="${-r}" r=".17" fill="${o.barva}" stroke="#fff" stroke-width=".05"/><circle cy="${r}" r=".17" fill="${o.barva}" stroke="#fff" stroke-width=".05"/>`; } },
  utok:   { nazev: 'Útok', stoji: 'utok', sk: 'hraci', barva: '#c62828', toc: true, cislo: true, kuzel: true, stredPopisu: -0.1,
            kresli: (o) => `<path d="M.55 0 L-.38 -.46 L-.38 .46 Z" fill="${o.barva}" stroke="#fff" stroke-width=".06" stroke-linejoin="round"/>` },
  rozbeh3:{ nazev: 'Rozběh 3 kroky', sk: 'cary', barva: '#1b2430', toc: true, nahled: 1.6,
            kresli: (o) => `<path d="${vlny(3)}" fill="none" stroke="${o.barva}" stroke-width=".11" stroke-linecap="round"/>` },
  rozbeh2:{ nazev: 'Rozběh 2 kroky', sk: 'cary', barva: '#1b2430', toc: true, nahled: 1.6,
            kresli: (o) => `<path d="${vlny(2)}" fill="none" stroke="${o.barva}" stroke-width=".11" stroke-linecap="round"/>` },
  trener: { nazev: 'Trenér', stoji: 'trener', sk: 'hraci', barva: '#1b2430', toc: true, kuzel: true, bezOtoceniTvaru: true,
            kresli: (o) => `<text x="0" y=".03" fill="${o.barva}" stroke="#fff" stroke-width=".09" paint-order="stroke" font-family="DM Sans, sans-serif" font-weight="700" font-size="1" text-anchor="middle" dominant-baseline="central">T</text>` },
  asist:  { nazev: 'Asistent', stoji: 'asist', sk: 'hraci', barva: '#4a5564', toc: true, kuzel: true, bezOtoceniTvaru: true,
            kresli: (o) => `<text x="0" y=".03" fill="${o.barva}" stroke="#fff" stroke-width=".09" paint-order="stroke" font-family="DM Sans, sans-serif" font-weight="700" font-size="1" text-anchor="middle" dominant-baseline="central">A</text>` },
  mic:    { nazev: 'Míč', tr: 'Míč', stoji: 'mic', sk: 'mic', pevna: true,

const CARY = {

  odraz:  { nazev: 'Odraz', barva: '#ffffff', ohyb: 0 }, // odraz míče po útoku – vzniká jen tlačítkem u útoku, začátek trvale na dopadu

// Kolo kzorne (116B): zorné pole v kroku (při přehrávání krok, který se právě hraje); bez údaje v kroku platí dřívější nastavení prvku
function kuzelVKroku(o) { const q = S.kroky[S.cur]?.pos?.[o.id]; return q && 'kuzel' in q ? !!q.kuzel : !!o.kuzel; }
function kresliPrvek(o, p, vybrany, podlaha3d = false) {
  const t = TYPY[o.typ];
  // Kolo 3: ve 3D stojí postava v horní vrstvě; na podlaze zůstane stopa (u hráčů poloprůhledný symbol) a zorné pole
  const stopa = podlaha3d && t.stoji;
  const hrac = ['postava', 'blok', 'utok', 'blok2', 'blok3', 'nohy', 'trener', 'asist', 'figurina'].includes(t.stoji);
  const rot = p.r || 0;
  const barva = o.barva || t.barva;
  const ob = { ...o, barva };
  let s = '';
  if (kuzelVKroku(o) && t.kuzel) {
    const d = 3.2, uhel = 35 * Math.PI / 180;
    const gid = 'kz' + o.id;
    if (podlaha3d) {
      // Kolo kskokplan (88A): ve 3D bez přechodu – Chrome v rámečku (Trenér) přechod v otočené podlaze občas nevykreslí
      let v = ''; for (let i = 6; i >= 1; i--) { const r = d * i / 6; v += `<path d="M0 0 L${r * Math.cos(uhel)} ${-r * Math.sin(uhel)} A${r} ${r} 0 0 1 ${r * Math.cos(uhel)} ${r * Math.sin(uhel)} Z"/>`; }
      s += `<g class="kuzel3d" fill="${barva}" fill-opacity=".075" transform="rotate(${rot})" pointer-events="none">${v}</g>`;
    } else {
    s += `<defs><radialGradient id="${gid}" cx="0" cy="0" r="${d}" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${barva}" stop-opacity=".45"/><stop offset="1" stop-color="${barva}" stop-opacity="0"/></radialGradient></defs>`;
    s += `<path d="M0 0 L${d * Math.cos(uhel)} ${-d * Math.sin(uhel)} A${d} ${d} 0 0 1 ${d * Math.cos(uhel)} ${d * Math.sin(uhel)} Z" fill="url(#${gid})" transform="rotate(${rot})" pointer-events="none"/>`;
    }
  }
  let tvar = t.bezOtoceniTvaru ? t.kresli(ob) : `<g transform="rotate(${rot})">${t.kresli(ob)}</g>`;
  if (o.typ === 'mic') {
    // Kolo 3: výška míče v plánu – čím výš, tím větší míč a dál od něj stín
    const z = p.z ?? VYSKY.mic, k = .85 + z * .1, d = z * .09;
    tvar = `<ellipse cx="${d}" cy="${d}" rx="${.2 * k}" ry="${.13 * k}" fill="#000" fill-opacity="${z < .3 ? .15 : .25}"/><g transform="scale(${k})">${tvar}</g>`;
  }
  // Kolo kskokplan (84A): výskok bloku v plánu – při přehrávání zvětšení se stínem (85C: v klidu bez značky)
  // komentář v náhledu: útočník s útokem z výskoku se v plánu stejně pohoupne v okamžiku úderu (vrchol pohupnutí = úder)
  const blokar = ['blok', 'blok2', 'blok3'].includes(t.stoji), utocnik = o.typ === 'utok';
  if ((blokar || utocnik) && !podlaha3d) {
    const r0 = t.nahled ? t.nahled / 2 : .5, v = anim ? ((utocnik ? anim.skokUtok : anim.skok)?.[o.id] || 0) / .55 : 0;
    if (v > .01) { const d = v * .16; tvar = `<g class="skok-stin" transform="translate(${d.toFixed(3)} ${d.toFixed(3)}) rotate(${rot})"><ellipse rx="${(r0 * .9).toFixed(3)}" ry="${(Math.min(r0, .5) * .8).toFixed(3)}" fill="#000" fill-opacity="${(.22 * v).toFixed(3)}"/></g><g class="skok" transform="scale(${(1 + .2 * v).toFixed(3)})">${tvar}</g>`; }
  }
  if (!stopa) s += tvar; else if (hrac) s += `<g opacity=".3">${tvar}</g>`;
  if (o.typ === 'predmet' && !stopa) s += text(o.popis, popisBarva(barva), .26, .01);
  else if (t.cislo && o.popis && !stopa) s += `<g transform="translate(${t.stredPopisu ? Math.cos(rot * Math.PI / 180) * t.stredPopisu : 0} ${t.stredPopisu ? Math.sin(rot * Math.PI / 180) * t.stredPopisu : 0})">${text(o.popis, popisBarva(barva), String(o.popis).length > 2 ? .34 : .46)}</g>`;
  const delka = t.delka ? (o.delka ?? t.vychozi.delka) : 0;
  const zachyt = delka ? `<rect x="${-delka / 2 - .1}" y="-.35" width="${delka + .2}" height=".7" fill="transparent" transform="rotate(${rot})"/>`
    : `<circle r="${t.nahled ? t.nahled / 2 : .5}" fill="transparent"/>`;
  return `<g class="prvek" data-id="${o.id}" transform="translate(${p.x} ${p.y})" style="cursor:move">${zachyt}${s}${vybrany ? (delka ? `<rect x="${-delka / 2 - .15}" y="-.4" width="${delka + .3}" height=".8" rx=".1" transform="rotate(${rot})" fill="none" stroke="#FFC72C" stroke-width=".05" stroke-dasharray=".14 .1" pointer-events="none"/>` : `<circle r="${(t.nahled ? t.nahled / 2 : .5) + .1}" fill="none" stroke="#FFC72C" stroke-width=".05" stroke-dasharray=".14 .1" pointer-events="none"/>`) : ''}</g>`;
}

function kontrolniBod(c) {
  const mx = (c.x1 + c.x2) / 2, my = (c.y1 + c.y2) / 2;
  const dx = c.x2 - c.x1, dy = c.y2 - c.y1, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  return { mx, my, cx: mx + nx * c.ohyb * 2, cy: my + ny * c.ohyb * 2, vx: mx + nx * c.ohyb, vy: my + ny * c.ohyb };
}
function sipka(x, y, uhel, vel, barva, plna = true) {
  const a = 0.45;
  const p1 = [x - vel * Math.cos(uhel - a), y - vel * Math.sin(uhel - a)];
  const p2 = [x - vel * Math.cos(uhel + a), y - vel * Math.sin(uhel + a)];
  return plna
    ? `<path d="M${x} ${y} L${p1} L${p2} Z" fill="${barva}" stroke="${barva}" stroke-width=".03" stroke-linejoin="round"/>`
    : `<path d="M${p1} L${x} ${y} L${p2}" fill="none" stroke="${barva}" stroke-width=".07" stroke-linecap="round" stroke-linejoin="round"/>`;
}
// Kolo 2: styl čáry (plná / čárkovaná / tečkovaná) a konec (šipka / bez); výchozí podle významu
const VYCHOZI_STYL = { oblouk: 'plna', uder: 'plna', beh: 'carkovana', lajna: 'plna', odraz: 'carkovana' };
const POMLCKY = { plna: '', carkovana: ' stroke-dasharray=".26 .17"', teckovana: ' stroke-dasharray=".001 .17"' };
function kresliCaru(c, vybrana, duch, podlaha3d = false) {
  const t = CARY[c.typ];
  const barva = c.barva || t.barva;
  if (podlaha3d && (c.typ === 'oblouk' || c.typ === 'odraz' || (c.typ === 'uder' && (c.mic || utokOdHrace(c))))) {
    // Kolo 3: ve 3D letí oblouk vzduchem (vrstva postav); na podlaze zůstane rovný stín a plocha na chycení
    const zv = vybrana ? `<path d="M${c.x1} ${c.y1}L${c.x2} ${c.y2}" stroke="#FFC72C" stroke-opacity=".5" stroke-width=".25" stroke-linecap="round"/>` : '';
    return `<g class="cara" data-id="${c.id}" ${duch ? `opacity="${duch === true ? SLABNUTI[0] : duch}" pointer-events="none"` : 'style="cursor:pointer"'}>${zv}<path d="M${c.x1} ${c.y1}L${c.x2} ${c.y2}" stroke="#000" stroke-opacity=".25" stroke-width=".06" stroke-dasharray=".15 .15"/><path d="M${c.x1} ${c.y1}L${c.x2} ${c.y2}" stroke="transparent" stroke-width=".7"/>${c.mic && !cisty() && S.prvky.some((o) => o.id === c.mic) ? `<circle cx="${c.x1}" cy="${c.y1}" r=".36" fill="none" stroke="${barva}" stroke-width=".045" stroke-dasharray=".09 .07" pointer-events="none"/>` : ''}</g>`;
  }
  const pomlcky = POMLCKY[c.styl || VYCHOZI_STYL[c.typ]];
  const pripnuto = (c.mic || c.od) && !cisty() && S.prvky.some((o) => o.id === (c.mic || c.od)) ? `<circle cx="${c.x1}" cy="${c.y1}" r=".36" fill="none" stroke="${barva}" stroke-width=".045" stroke-dasharray=".09 .07" pointer-events="none"/>` : '';
  const pripnutoKonec = c.cil && !cisty() && S.prvky.some((o) => o.id === c.cil) ? `<circle cx="${c.x2}" cy="${c.y2}" r=".42" fill="none" stroke="${barva}" stroke-width=".045" stroke-dasharray=".09 .07" pointer-events="none"/>` : '';
  const hrot = c.konec !== 'bez';
  const k = kontrolniBod(c);
  const uhelKonce = Math.atan2(c.y2 - k.cy, c.x2 - k.cx);
  let s = '';
  if (jeNadhoz(c)) { // Kolo knadhoz
    s += `<path d="${smyckaNadhozu(c)}" fill="none" stroke="${barva}" stroke-width=".07" stroke-linecap="round"${pomlcky}/>`;
    if (hrot) s += sipka(c.x1 + .1, c.y1 - .3, Math.atan2(1.4, -.65), .34, barva);
  } else if (c.typ === 'oblouk') {
    const zkr = hrot ? .22 : 0, ex = c.x2 - Math.cos(uhelKonce) * zkr, ey = c.y2 - Math.sin(uhelKonce) * zkr;
    s += `<path d="M${c.x1} ${c.y1} Q${k.cx} ${k.cy} ${ex} ${ey}" fill="none" stroke="${barva}" stroke-width=".07" stroke-linecap="round"${pomlcky}/>`;
    if (hrot) s += sipka(c.x2, c.y2, uhelKonce, .38, barva);
  } else if (c.typ === 'lajna') {
    s += `<path d="M${c.x1} ${c.y1}L${c.x2} ${c.y2}" stroke="${barva}" stroke-width=".09" stroke-linecap="square"${pomlcky}/>`;
    if (hrot) s += sipka(c.x2, c.y2, Math.atan2(c.y2 - c.y1, c.x2 - c.x1), .34, barva, false);
  } else if (c.typ === 'odraz') {
    const dx = c.x2 - c.x1, dy = c.y2 - c.y1, L = Math.hypot(dx, dy) || 1, zk = hrot ? .26 : 0;
    s += `<path d="M${c.x1} ${c.y1}L${c.x2 - dx / L * zk} ${c.y2 - dy / L * zk}" stroke="${barva}" stroke-width=".06" stroke-linecap="round"${pomlcky}/>`;
    if (hrot) s += sipka(c.x2, c.y2, Math.atan2(dy, dx), .34, barva);
  } else if (c.typ === 'beh') {
    s += `<path d="M${c.x1} ${c.y1} Q${k.cx} ${k.cy} ${c.x2} ${c.y2}" fill="none" stroke="${barva}" stroke-width=".07" stroke-linecap="round"${pomlcky}/>`;
    if (hrot) s += sipka(c.x2, c.y2, uhelKonce, .34, barva, false);
  } else {
    const dx = c.x2 - c.x1, dy = c.y2 - c.y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux, o = .09;
    const zk = hrot ? .4 : 0, ex = c.x2 - ux * zk, ey = c.y2 - uy * zk;
    s += `<path d="M${c.x1 + nx * o} ${c.y1 + ny * o} L${ex + nx * o} ${ey + ny * o} M${c.x1 - nx * o} ${c.y1 - ny * o} L${ex - nx * o} ${ey - ny * o}" stroke="${barva}" stroke-width=".07" stroke-linecap="round"${pomlcky}/>`;
    if (hrot) s += sipka(c.x2, c.y2, Math.atan2(dy, dx), .5, barva);
  }
  const dz = jeNadhoz(c) ? smyckaNadhozu(c) : `M${c.x1} ${c.y1} Q${k.cx} ${k.cy} ${c.x2} ${c.y2}`; // Kolo knadhoz
  const zachyt = `<path d="${dz}" fill="none" stroke="transparent" stroke-width=".7"/>`;
  const zvyr = vybrana ? `<path d="${dz}" fill="none" stroke="#FFC72C" stroke-opacity=".55" stroke-width=".3" stroke-linecap="round" pointer-events="none"/>` : '';
  return `<g class="cara" data-id="${c.id}" ${duch ? `opacity="${duch === true ? SLABNUTI[0] : duch}" pointer-events="none"` : 'style="cursor:pointer"'}>${zvyr}${zachyt}${s}${pripnuto}${pripnutoKonec}</g>`;
}

// ------------------------------------------------------------ stav
const KLIC = 'trenerova-tabulka:nahled-k3';
let dalsiId = 1;
const noveId = () => 'p' + (dalsiId++);

function ukazka() {
  const objs = [], pos = {};
  const dej = (typ, x, y, extra = {}) => { const id = noveId(); objs.push({ id, typ, ...extra }); pos[id] = { x, y, r: extra.r ?? 0 }; return id; };
